version: "3.8"

services:
  web:
    image: IMAGE_PLACEHOLDER
    ports:
      - "80:80"
    deploy:
      replicas: 3
      placement:
        preferences:
          - spread: node.id
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 5s
        order: stop-first
    networks:
      - app-network

networks:
  app-network:
    driver: overlay
